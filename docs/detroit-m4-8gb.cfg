# Detroit: Become Human — M4 iPad 8 GB first-test profile
#
# Paste these lines into:
#   Detroit > Game details > Advanced > This game's config
#
# This is intentionally conservative. The goal is to finish shader compilation
# without an iPadOS memory-pressure kill before we optimize launch speed.
# It affects Detroit only when stored as that game's config.

# Detroit's renderer uses very large descriptor arrays / bindless resources.
# MoltenVK's Metal argument buffers are what expose the much larger descriptor
# capacity needed for that path on Apple GPUs. Current MoltenVK normally enables
# them automatically when supported, but Detroit makes the requirement explicit
# so a default change cannot silently drop us back to the small legacy limits.
#
# IMPORTANT: this setting alone does NOT qualify the runtime. Current upstream
# MoltenVK has an open Apple-Silicon report where some compute stores can be lost
# with argument buffers enabled. Madeira's Detroit pre-game gate therefore must
# pass its compute write/readback integrity canary with this setting on before
# Detroit itself is allowed to advance.
env.MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS = 1

# Known-good Detroit/MoltenVK requirement from successful Apple-Silicon runs.
# LZ4 compresses retained MSL source used by Vulkan pipeline-cache export,
# directly addressing a known source of high shader memory use.
env.MVK_CONFIG_SHADER_COMPRESSION_ALGORITHM = 3

# IMPORTANT: do not add MVK_CONFIG_SHOULD_MAXIMIZE_CONCURRENT_COMPILATION as an
# iPad memory tweak. Current MoltenVK documents that setting as having no effect
# on iOS/tvOS. Release003 recommends value 1 for its macOS/CrossOver setup, but
# it is not an iPad lever and should not be counted as one.

# Madeira's audited Release003 patch separates two things the original fork tied
# together. Keep the process-wide MTLLibrary retention map OFF: otherwise every
# compiled Metal library can remain alive and consume scarce app memory.
env.MVK_DTR_MSL_LIBRARY_CACHE = 0

# Keep the DISK shader cache ON independently. A precompiled .metallib can be
# loaded from disk without putting it in the process-wide retention map. When a
# .metallib is missing, MoltenVK compiles normally and records the matching MSL
# source/meta on disk so it can be compiled offline for iPhoneOS later.
#
# This switch requires Madeira's MADEIRA_IPAD_DISK_CACHE_SPLIT_V1 MoltenVK patch;
# the Detroit Vulkan build/payload verifier refuses a runtime missing that patch.
env.MVK_DTR_MSL_LIBRARY_DISK_CACHE = 1

# Keep real app-memory headroom, footprint, peak footprint, thermal state, and
# power state visible during long shader-compilation tests.
env.MADEIRA_DEVICE_STATS = 1

# Keep the first performance gate modest and repeatable.
# Set the Library entry itself to 1280x720-class, Low in Detroit, and 30 FPS.
# In GraphicOptions.JSON, DEPTH_OF_FIELD should be 0 for the current Detroit
# MoltenVK compatibility path.
