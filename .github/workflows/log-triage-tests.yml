name: Madeira log triage tests

on:
  push:
    paths:
      - "tools/madeira_log_triage.py"
      - "tests/test_madeira_log_triage.py"
      - ".github/workflows/log-triage-tests.yml"
  pull_request:
    paths:
      - "tools/madeira_log_triage.py"
      - "tests/test_madeira_log_triage.py"
      - ".github/workflows/log-triage-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile tools/madeira_log_triage.py tests/test_madeira_log_triage.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_madeira_log_triage.py" -v
