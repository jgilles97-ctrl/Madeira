name: HunieCam iPad compatibility checks

on:
  push:
    paths:
      - "tools/huniecam_*.py"
      - "tools/madeira_log_triage.py"
      - "tests/test_huniecam_*.py"
      - "tests/test_madeira_log_triage.py"
      - "docs/HUNIECAM*.md"
      - ".github/workflows/huniecam-ipad-compat.yml"
  pull_request:
    paths:
      - "tools/huniecam_*.py"
      - "tools/madeira_log_triage.py"
      - "tests/test_huniecam_*.py"
      - "tests/test_madeira_log_triage.py"
      - "docs/HUNIECAM*.md"
      - ".github/workflows/huniecam-ipad-compat.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every HunieCam helper and test
        run: >-
          python -m py_compile
          tools/huniecam_*.py
          tools/madeira_log_triage.py
          tests/test_huniecam_*.py
          tests/test_madeira_log_triage.py
      - name: Run full HunieCam regression suite
        run: python -m unittest discover -s tests -p 'test_huniecam_*.py' -v
      - name: Run generic Madeira log triage regressions
        run: python -m unittest tests.test_madeira_log_triage -v
