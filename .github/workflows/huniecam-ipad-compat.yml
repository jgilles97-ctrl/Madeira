name: HunieCam iPad compatibility checks

on:
  push:
    paths:
      - "tools/huniecam_probe.py"
      - "tools/huniecam_session_triage.py"
      - "tools/huniecam_save_probe.py"
      - "tools/huniecam_acceptance.py"
      - "tools/madeira_log_triage.py"
      - "tests/test_huniecam_probe.py"
      - "tests/test_huniecam_session_triage.py"
      - "tests/test_huniecam_save_probe.py"
      - "tests/test_huniecam_acceptance.py"
      - "tests/test_madeira_log_triage.py"
      - ".github/workflows/huniecam-ipad-compat.yml"
  pull_request:
    paths:
      - "tools/huniecam_probe.py"
      - "tools/huniecam_session_triage.py"
      - "tools/huniecam_save_probe.py"
      - "tools/huniecam_acceptance.py"
      - "tools/madeira_log_triage.py"
      - "tests/test_huniecam_probe.py"
      - "tests/test_huniecam_session_triage.py"
      - "tests/test_huniecam_save_probe.py"
      - "tests/test_huniecam_acceptance.py"
      - "tests/test_madeira_log_triage.py"
      - ".github/workflows/huniecam-ipad-compat.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile helper tools
        run: >-
          python -m py_compile
          tools/huniecam_probe.py
          tools/huniecam_session_triage.py
          tools/huniecam_save_probe.py
          tools/huniecam_acceptance.py
          tools/madeira_log_triage.py
          tests/test_huniecam_probe.py
          tests/test_huniecam_session_triage.py
          tests/test_huniecam_save_probe.py
          tests/test_huniecam_acceptance.py
          tests/test_madeira_log_triage.py
      - name: Run title preflight tests
        run: python -m unittest tests.test_huniecam_probe -v
      - name: Run combined session diagnosis tests
        run: python -m unittest tests.test_huniecam_session_triage -v
      - name: Run save persistence tests
        run: python -m unittest tests.test_huniecam_save_probe -v
      - name: Run acceptance gate tests
        run: python -m unittest tests.test_huniecam_acceptance -v
      - name: Run generic log triage regression tests
        run: python -m unittest tests.test_madeira_log_triage -v
