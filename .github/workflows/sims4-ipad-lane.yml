name: Sims 4 iPad lane tests

on:
  push:
    paths:
      - "tools/sims4_ipad_preflight.py"
      - "tools/sims4_log_triage.py"
      - "tools/sims4_runtime_audit.py"
      - "tests/test_sims4*.py"
      - "docs/SIMS4_IPAD_LOCAL.md"
      - ".github/workflows/sims4-ipad-lane.yml"
  pull_request:
    paths:
      - "tools/sims4_ipad_preflight.py"
      - "tools/sims4_log_triage.py"
      - "tools/sims4_runtime_audit.py"
      - "tests/test_sims4*.py"
      - "docs/SIMS4_IPAD_LOCAL.md"
      - ".github/workflows/sims4-ipad-lane.yml"

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          tools/sims4_ipad_preflight.py
          tools/sims4_log_triage.py
          tools/sims4_runtime_audit.py
          tests/test_sims4_ipad_tools.py
          tests/test_sims4_runtime_and_convergence.py
      - name: Unit and convergence tests
        run: python -m unittest discover -s tests -p "test_sims4*.py" -v
      - name: Audit checked-in ARM64EC runtime
        run: python tools/sims4_runtime_audit.py --json sims4-runtime-audit.json
