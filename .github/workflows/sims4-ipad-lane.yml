name: Sims 4 iPad lane tests

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sims4_ipad_preflight.py"
      - "tools/sims4_ea_prefix_audit.py"
      - "tools/sims4_ea_cef_roles.py"
      - "tools/sims4_launcher_canary_parse.py"
      - "tools/sims4_font_remediation.py"
      - "tools/sims4_log_triage.py"
      - "tools/sims4_runtime_audit.py"
      - "tools/sims4_evidence_bundle.py"
      - "build/wine-pe/build-modules.sh"
      - "tests/x64/sims4-launcher-canary.c"
      - "tests/x64/build.sh"
      - "tests/test_sims4*.py"
      - "docs/SIMS4_IPAD_LOCAL.md"
      - ".github/workflows/sims4-ipad-lane.yml"
  pull_request:
    paths:
      - "tools/sims4_ipad_preflight.py"
      - "tools/sims4_ea_prefix_audit.py"
      - "tools/sims4_ea_cef_roles.py"
      - "tools/sims4_launcher_canary_parse.py"
      - "tools/sims4_font_remediation.py"
      - "tools/sims4_log_triage.py"
      - "tools/sims4_runtime_audit.py"
      - "tools/sims4_evidence_bundle.py"
      - "build/wine-pe/build-modules.sh"
      - "tests/x64/sims4-launcher-canary.c"
      - "tests/x64/build.sh"
      - "tests/test_sims4*.py"
      - "docs/SIMS4_IPAD_LOCAL.md"
      - ".github/workflows/sims4-ipad-lane.yml"

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: >-
          python -m py_compile
          tools/sims4_ipad_preflight.py
          tools/sims4_ea_prefix_audit.py
          tools/sims4_ea_cef_roles.py
          tools/sims4_launcher_canary_parse.py
          tools/sims4_font_remediation.py
          tools/sims4_log_triage.py
          tools/sims4_runtime_audit.py
          tools/sims4_evidence_bundle.py
          tests/test_sims4_ipad_tools.py
          tests/test_sims4_ea_prefix_audit.py
          tests/test_sims4_ea_cef_roles.py
          tests/test_sims4_ea_signatures.py
          tests/test_sims4_font_remediation.py
          tests/test_sims4_runtime_and_convergence.py
          tests/test_sims4_evidence_bundle.py
          tests/test_sims4_launcher_canary_parse.py
          tests/test_sims4_launcher_coverage.py
      - name: Unit and convergence tests
        run: python -m unittest discover -s tests -p "test_sims4*.py" -v
      - name: Audit checked-in ARM64EC runtime
        run: python tools/sims4_runtime_audit.py --json sims4-runtime-audit.json

  arm64ec-launcher-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out exact Madeira Wine submodule
        shell: bash
        run: |
          set -euo pipefail
          WINE_SHA="$(git ls-tree HEAD wine | awk '{print $3}')"
          test -n "$WINE_SHA"
          echo "Wine submodule: $WINE_SHA"
          rm -rf wine
          git clone --filter=blob:none https://github.com/willfaust/wine.git wine
          git -C wine checkout --detach "$WINE_SHA"
          test "$(git -C wine rev-parse HEAD)" = "$WINE_SHA"

      - name: Install bison 3+
        shell: bash
        run: |
          set -euo pipefail
          brew list bison >/dev/null 2>&1 || brew install bison
          "$(brew --prefix bison)/bin/bison" --version | head -1

      - name: Download pinned llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchains
          ARCHIVE="$RUNNER_TEMP/llvm-mingw-20260421-ucrt-macos-universal.tar.xz"
          curl --fail --location --retry 3 \
            --output "$ARCHIVE" \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  $ARCHIVE" | shasum -a 256 -c -
          tar -xf "$ARCHIVE" -C toolchains
          test -x toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/arm64ec-w64-mingw32-clang
          test -x toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/x86_64-w64-mingw32-clang

      - name: Build validated ARM64EC launcher coverage modules
        id: modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/arm64ec-windows
          DEST="$PWD/out/arm64ec-windows" JOBS=4 \
            bash build/wine-pe/build-modules.sh \
              avifil32 msvfw32 netprofm sensapi
          for f in avifil32.dll msvfw32.dll netprofm.dll sensapi.dll; do
            test -s "out/arm64ec-windows/$f"
          done
          shasum -a 256 \
            out/arm64ec-windows/avifil32.dll \
            out/arm64ec-windows/msvfw32.dll \
            out/arm64ec-windows/netprofm.dll \
            out/arm64ec-windows/sensapi.dll \
            | sort > out/SHA256SUMS.modules
          cat out/SHA256SUMS.modules

      - name: Build x64 Sims launcher canary
        id: canary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE="$PWD/out/arm64ec-windows" \
            bash tests/x64/build.sh sims4-launcher-canary

      - name: Verify and fingerprint complete outputs
        if: steps.canary.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s out/arm64ec-windows/sims4-launcher-canary.exe
          shasum -a 256 out/arm64ec-windows/* | sort > out/SHA256SUMS
          python3 tools/sims4_runtime_audit.py out/arm64ec-windows \
            --json out/sims4-launcher-runtime-audit.json
          cat out/SHA256SUMS
          cat out/sims4-launcher-runtime-audit.json

      - name: Upload preserved cloud build outputs
        if: always() && steps.modules.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: sims4-arm64ec-launcher-coverage-${{ github.sha }}
          path: |
            out/arm64ec-windows/*
            out/SHA256SUMS.modules
            out/SHA256SUMS
            out/sims4-launcher-runtime-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail job if canary compilation failed
        if: steps.canary.outcome != 'success'
        shell: bash
        run: |
          echo "ARM64EC DLL outputs were preserved, but the x64 canary did not compile."
          exit 1
