name: Detroit readiness tests

on:
  push:
    paths:
      - "tools/detroit_readiness.py"
      - "tests/host/check-detroit-readiness.py"
      - ".github/workflows/detroit-readiness-tests.yml"
  pull_request:
    paths:
      - "tools/detroit_readiness.py"
      - "tests/host/check-detroit-readiness.py"
      - ".github/workflows/detroit-readiness-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile tools/detroit_readiness.py tests/host/check-detroit-readiness.py
      - name: Detroit readiness fixtures
        run: python tests/host/check-detroit-readiness.py
