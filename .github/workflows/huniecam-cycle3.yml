name: HunieCam cycle 3 guardrails

on:
  push:
    paths:
      - "tools/huniecam_run_compare.py"
      - "tools/huniecam_performance.py"
      - "tools/huniecam_session_triage.py"
      - "tests/test_huniecam_run_compare.py"
      - "tests/test_huniecam_performance.py"
      - "tests/test_huniecam_session_triage.py"
      - ".github/workflows/huniecam-cycle3.yml"
  pull_request:
    paths:
      - "tools/huniecam_run_compare.py"
      - "tools/huniecam_performance.py"
      - "tools/huniecam_session_triage.py"
      - "tests/test_huniecam_run_compare.py"
      - "tests/test_huniecam_performance.py"
      - "tests/test_huniecam_session_triage.py"
      - ".github/workflows/huniecam-cycle3.yml"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile cycle 3 tools
        run: >-
          python -m py_compile
          tools/huniecam_run_compare.py
          tools/huniecam_performance.py
          tools/huniecam_session_triage.py
          tests/test_huniecam_run_compare.py
          tests/test_huniecam_performance.py
          tests/test_huniecam_session_triage.py
      - name: Run A/B comparison tests
        run: python -m unittest tests.test_huniecam_run_compare -v
      - name: Run performance evidence tests
        run: python -m unittest tests.test_huniecam_performance -v
      - name: Run session triage guardrails
        run: python -m unittest tests.test_huniecam_session_triage -v
