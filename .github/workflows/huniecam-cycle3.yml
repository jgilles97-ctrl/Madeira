name: HunieCam evidence guardrails

on:
  push:
    paths:
      - "tools/huniecam_*.py"
      - "tests/test_huniecam_*.py"
      - ".github/workflows/huniecam-cycle3.yml"
  pull_request:
    paths:
      - "tools/huniecam_*.py"
      - "tests/test_huniecam_*.py"
      - ".github/workflows/huniecam-cycle3.yml"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all HunieCam evidence tools
        run: python -m py_compile tools/huniecam_*.py tests/test_huniecam_*.py
      - name: Audit schema synchronization
        run: python tools/huniecam_schema_audit.py
      - name: Run provenance and dependency guardrails
        run: >-
          python -m unittest -v
          tests.test_huniecam_run_context
          tests.test_huniecam_pe_imports
          tests.test_huniecam_native_modules
          tests.test_huniecam_dependency_plan
          tests.test_huniecam_evidence_contract
          tests.test_huniecam_evidence_manifest
          tests.test_huniecam_run_compare
          tests.test_huniecam_attempt_ledger
      - name: Run device and final-acceptance guardrails
        run: >-
          python -m unittest -v
          tests.test_huniecam_performance
          tests.test_huniecam_save_probe
          tests.test_huniecam_device_evidence
          tests.test_huniecam_repeatability
          tests.test_huniecam_acceptance
          tests.test_huniecam_acceptance_bundle
      - name: Run pipeline and runtime triage guardrails
        run: >-
          python -m unittest -v
          tests.test_huniecam_pipeline
          tests.test_huniecam_session_triage
          tests.test_huniecam_issue_matcher
          tests.test_huniecam_failure_capsule
          tests.test_huniecam_config_guard
          tests.test_huniecam_schema_audit
