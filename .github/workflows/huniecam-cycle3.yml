name: HunieCam evidence guardrails

on:
  push:
    paths:
      - "tools/huniecam_run_compare.py"
      - "tools/huniecam_run_record.py"
      - "tools/huniecam_performance.py"
      - "tools/huniecam_evidence_contract.py"
      - "tools/huniecam_next_run.py"
      - "tools/huniecam_config_guard.py"
      - "tools/huniecam_acceptance.py"
      - "tools/huniecam_device_evidence.py"
      - "tools/huniecam_registry_snapshot.py"
      - "tools/huniecam_failure_capsule.py"
      - "tools/huniecam_pipeline.py"
      - "tools/huniecam_session_triage.py"
      - "tests/test_huniecam_run_compare.py"
      - "tests/test_huniecam_run_record.py"
      - "tests/test_huniecam_performance.py"
      - "tests/test_huniecam_evidence_contract.py"
      - "tests/test_huniecam_next_run.py"
      - "tests/test_huniecam_config_guard.py"
      - "tests/test_huniecam_acceptance.py"
      - "tests/test_huniecam_device_evidence.py"
      - "tests/test_huniecam_registry_snapshot.py"
      - "tests/test_huniecam_failure_capsule.py"
      - "tests/test_huniecam_pipeline.py"
      - "tests/test_huniecam_session_triage.py"
      - ".github/workflows/huniecam-cycle3.yml"
  pull_request:
    paths:
      - "tools/huniecam_*.py"
      - "tests/test_huniecam_*.py"
      - ".github/workflows/huniecam-cycle3.yml"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile evidence-critical tools
        run: >-
          python -m py_compile
          tools/huniecam_run_compare.py
          tools/huniecam_run_record.py
          tools/huniecam_performance.py
          tools/huniecam_evidence_contract.py
          tools/huniecam_next_run.py
          tools/huniecam_config_guard.py
          tools/huniecam_acceptance.py
          tools/huniecam_device_evidence.py
          tools/huniecam_registry_snapshot.py
          tools/huniecam_failure_capsule.py
          tools/huniecam_pipeline.py
          tools/huniecam_session_triage.py
      - name: Run evidence-integrity tests
        run: >-
          python -m unittest -v
          tests.test_huniecam_run_compare
          tests.test_huniecam_run_record
          tests.test_huniecam_evidence_contract
          tests.test_huniecam_config_guard
          tests.test_huniecam_next_run
          tests.test_huniecam_pipeline
      - name: Run device-acceptance tests
        run: >-
          python -m unittest -v
          tests.test_huniecam_performance
          tests.test_huniecam_acceptance
          tests.test_huniecam_device_evidence
          tests.test_huniecam_registry_snapshot
          tests.test_huniecam_failure_capsule
          tests.test_huniecam_session_triage
